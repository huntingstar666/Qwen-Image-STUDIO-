<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Qwen-Image 2.1 工作台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23faf8f4'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%232f6b62' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23b87340'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/assets/css/app.css" />
    <link rel="stylesheet" href="/assets/css/mask.css" />
    <link rel="stylesheet" href="/assets/css/tools.css" />
    <link rel="stylesheet" href="/assets/css/theme.css" />
    <link rel="stylesheet" href="/assets/css/shell.css" />
    <link rel="stylesheet" href="/assets/css/library.css" />
    <link rel="stylesheet" href="/assets/css/studio.css" />
    <link rel="stylesheet" href="/assets/css/composer.css" />
    <link rel="stylesheet" href="/assets/css/settings.css" />
    <link rel="stylesheet" href="/assets/css/video-studio.css" />
    <script>
      // 首屏应用主题 / 字体 / 强调色 / 语言，避免闪烁。读取与 store.js 使用同一个 key。
      (function () {
        try {
          var raw = localStorage.getItem('qi21.workbench.settings.v1');
          var settings = raw ? JSON.parse(raw) : {};
          var mode = settings.theme || 'system';
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? 'dark' : 'light';
          root.style.colorScheme = dark ? 'dark' : 'light';
          if (['system', 'sans', 'serif', 'mono'].indexOf(settings.font) >= 0) {
            root.dataset.font = settings.font;
          }
          if (['teal', 'ochre', 'indigo', 'violet'].indexOf(settings.accent) >= 0) {
            root.dataset.accent = settings.accent;
          }
          if (settings.language === 'en') root.lang = 'en';
        } catch (err) {
          /* 忽略：使用 CSS 默认亮色 */
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div class="noscript">本工作台需要启用 JavaScript 才能运行。</div>
    </noscript>

    <div id="app-shell" class="app-shell">
      <!-- 侧边栏：品牌、导航分组、主题与状态，由 app.js 渲染 -->
      <aside id="sidebar" class="sidebar" aria-label="主导航"></aside>

      <div class="app-main">
        <!-- 顶部工具栏：页面标题、引擎状态、主题切换 -->
        <header id="topbar" class="topbar"></header>

        <!-- 页面容器：各页面 DOM 在首次进入时挂载到这里 -->
        <main id="viewport" class="viewport" aria-live="polite"></main>
      </div>
    </div>

    <!-- 移动端侧边栏遮罩 -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- 全局中文提示 -->
    <div id="toast-root" class="toast-root" role="status" aria-live="assertive"></div>

    <!-- 模态框挂载点（提示词润色对比 / 历史详情等） -->
    <div id="modal-root"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
